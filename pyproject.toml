[project]
name = "generative-character"
version = "0.1.0"
description = "Generative NPC Dialogue Generation Project"
authors = [{ name="Connor Logan Kasarda" }]
requires-python = ">=3.10"
dependencies = [
    "pytest"
]

[project.scripts]
generative-character = "generative_character.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80

[tool.ruff]
line-length = 80
lint.select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
