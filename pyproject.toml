[project]
name = "template-project"
version = "0.1.0"
description = "Template Python project"
authors = [{ name="Project Name" }]
requires-python = ">=3.10"
dependencies = [
    "pytest"
]

[project.scripts]
template-project = "template_package.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
